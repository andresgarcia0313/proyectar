[package]
name = "app"
description = "Proyectar desktop app: CXX-Qt bridge between the motor and the QML interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "proyectar"
path = "src/main.rs"

[dependencies]
motor = { path = "../motor" }
cxx = "1.0.202"
cxx-qt = "0.10.0"
# Only core types are used from Rust (QString); the GUI, QML and Controls parts live in
# src/app_shim.cpp, so qt_full would only add C++ to build.
cxx-qt-lib = "0.10.0"
dirs = "7.0.0"
serde_json = "1.0.154"

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
