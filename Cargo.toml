[workspace]
resolver = "2"
members = ["crates/wfd", "crates/motor", "crates/app"]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Andrés García <andresgarcia0313@gmail.com>"]

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
